<!DOCTYPE html>
<html>
    <head>
        <title>Feedback Form</title>
        <link rel="stylesheet" href="form.css">
    </head>

    <body>

        <div class="header">
            <h1>Feedback Form</h1>
        </div>


        <div class="navigation">
            <a href="index.html">Home</a>
            <a href="tribute.html">Tribute Page</a>
            <a href="table.html">Table</a>
            <a href="form.html">Form</a>
        </div>


        <div class="content">

            <h1>Give me your feedback! :D</h1>

            <form>

                <label for="name">Name:</label>
                <input type="text" id="name" name="name">


                <label for="email">Email:</label>
                <input type="email" id="email" name="email">


                <label for="role">Your role:</label>

                <select id="role" name="role">
                    <option>Student</option>
                    <option>Teacher</option>
                    <option>Other</option>
                </select>


                <label>Do you like my website?</label>

                <div class="radio">
                    <input type="radio" id="yes" name="like" value="yes">
                    <label for="yes">Yes</label>

                    <input type="radio" id="no" name="like" value="no">
                    <label for="no">No</label>
                </div>


                <label for="comments">Comments:</label>

                <textarea id="comments" name="comments"></textarea>


                <button type="submit">Submit</button>

            </form>

        </div>


        <div class="footer">
            <p>2026 Dimash's Personal Site</p>
        </div>

    </body>
</html>
